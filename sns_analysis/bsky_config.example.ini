# Bluesky アカウントの設定ファイル（雛形）
#
# 使い方:
#   1. このファイルをコピーして，同じフォルダに bsky_config.ini という名前で保存する
#   2. handle と app_password を自分のものに書き換える
#   3. Notebook や scripts を実行すると，bsky_utils が自動で読み込んでログインする
#
# app_password は Bluesky の 設定 → プライバシーとセキュリティ → アプリパスワード で発行した
# 「xxxx-xxxx-xxxx-xxxx」形式の文字列．通常のログインパスワードは絶対に書かない．
# bsky_config.ini は .gitignore に登録済み（GitHub に上がらない）．他人と共有しない．
# 値は引用符（" や '）で囲まない．ハンドル名の先頭に @ は付けない．
# 保存するときのファイル名は bsky_config.ini（bsky_config.ini.ini や .txt にならないよう注意）．

[bluesky]
handle = your-name.bsky.social
app_password = xxxx-xxxx-xxxx-xxxx
# 通常は変更不要（自分のアカウントが bsky.social 以外のサーバにある場合だけ変える）
pds = https://bsky.social
